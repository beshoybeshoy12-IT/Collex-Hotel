name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collex
          POSTGRES_PASSWORD: collex_ci_password
          POSTGRES_DB: collex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collex" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://collex:collex_ci_password@localhost:5432/collex_test
      TEST_DATABASE_URL: postgresql://collex:collex_ci_password@localhost:5432/collex_test
      SESSION_SECRET: ci-only-session-secret-0123456789abcdefghijklmnop
      # 32 zero bytes, base64 — CI only, never use in any real environment.
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @collex/shared build
      - run: pnpm --filter @collex/api exec prisma generate
      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Lint
        run: pnpm turbo run lint
      - name: Tests (unit + integration against PostgreSQL)
        run: pnpm turbo run test
      - name: Build
        run: pnpm turbo run build
      - name: Dependency audit (high severity)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
