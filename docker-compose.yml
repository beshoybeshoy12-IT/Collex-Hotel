# Local development infrastructure. Not for production use as-is.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collex
      POSTGRES_PASSWORD: collex_dev_password
      POSTGRES_DB: collex
    ports: ["5434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collex"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  api:
    profiles: ["app"]
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://collex:collex_dev_password@postgres:5432/collex
    depends_on: [postgres]
    ports: ["4000:4000"]
    volumes: ["apistorage:/app/apps/api/storage"]
  worker:
    profiles: ["app"]
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "dist/src/worker/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://collex:collex_dev_password@postgres:5432/collex
    depends_on: [postgres]
  web:
    profiles: ["app"]
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
  apistorage:
